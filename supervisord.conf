# Supervisord runs as the non-root `lotto` user (USER lotto in the
# Dockerfile), so both child processes inherit UID 1000. The pidfile must
# therefore live somewhere writable — /tmp, not /var/run.
[supervisord]
nodaemon=true
logfile=/dev/stdout
logfile_maxbytes=0
pidfile=/tmp/supervisord.pid

# FastAPI backend
[program:api]
command=uvicorn api:app --host 0.0.0.0 --port 8000
directory=/app
autostart=true
autorestart=true
# Graceful stop: SIGTERM, give uvicorn up to 10s to drain
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0

# Streamlit dashboard
[program:dashboard]
command=streamlit run dashboard.py --server.port 8501 --server.address 0.0.0.0 --server.headless true
directory=/app
autostart=true
autorestart=true
stopsignal=TERM
stopwaitsecs=10
stdout_logfile=/dev/stdout
stdout_logfile_maxbytes=0
stderr_logfile=/dev/stderr
stderr_logfile_maxbytes=0
