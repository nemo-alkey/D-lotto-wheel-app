# nginx reverse proxy for the lotto stack.
#   /         -> Streamlit dashboard (with WebSocket upgrade headers)
#   /api/     -> FastAPI (path prefix stripped)
#   /health   -> FastAPI health probe
#   /mobile/  -> built mobile frontend, served statically by nginx

upstream lotto_api {
    server app:8000;
}

upstream lotto_dashboard {
    server app:8501;
}

server {
    listen 80;
    server_name _;

    # FastAPI — strip the /api prefix before forwarding
    location /api/ {
        proxy_pass http://lotto_api/;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # Health probe (used by external monitors)
    location = /health {
        proxy_pass http://lotto_api/health;
    }

    # Mobile frontend build — static files, no app round-trip
    location /mobile/ {
        alias /usr/share/nginx/html/mobile/;
        try_files $uri $uri/ /mobile/index.html;
        expires 1h;
    }

    # Streamlit dashboard — needs WebSocket headers for its live channel
    location / {
        proxy_pass http://lotto_dashboard;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 86400;   # long-lived websocket sessions
    }
}
