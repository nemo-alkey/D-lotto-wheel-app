[mypy]
exclude = (^|/)(scripts|venv|tests|migrations)/
ignore_missing_imports = True

# One-off / scratch scripts ? not worth type-checking
[mypy-test_pathway_params]
ignore_errors = True

[mypy-inspect_archive]
ignore_errors = True

[mypy-backfill_archive]
ignore_errors = True

# Legacy analysis scripts ? fix annotations incrementally
[mypy-lotto_analysis]
ignore_errors = True

[mypy-compare_guarantees]
ignore_errors = True

[mypy-abbreviated_wheel]
ignore_errors = True
