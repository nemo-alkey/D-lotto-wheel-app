[mypy]
python_version = 3.11
strict = true
ignore_missing_imports = true
warn_return_any = true
warn_unused_configs = true

# Only project code is type-checked; dependencies, build output and data
# directories are excluded.
exclude = (?x)(
    ^venv/
    | ^\.git/
    | ^\.mypy_cache/
    | ^mobile-frontend/
    | ^data/
    | ^exports/
    | ^backups/
    | ^main\.py\.bak$
  )
