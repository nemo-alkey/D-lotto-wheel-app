# CI — lint, test (Linux matrix), test (Windows)
#
# Runs on every push to main and every pull request targeting main.
# Jobs:
#   lint          — ruff check + ruff format --check + mypy (strict), fast fail
#   test          — pytest with coverage on ubuntu-latest, Python 3.11/3.12
#   test-windows  — same suite on windows-latest to catch path/encoding issues
#
# The repository's SQLite database (lotto.db) is gitignored, so the test
# jobs rebuild the schema via Alembic and seed synthetic draws before
# running the suite.

name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Cancel superseded runs on the same ref to save CI minutes.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ---------------------------------------------------------------------------
  lint:
    name: Lint (ruff + mypy)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"                      # cache pip downloads between runs

      - name: Install linters
        run: pip install ruff==0.5.0 mypy==1.10.0 types-requests

      # Config lives in pyproject.toml (ruff) and mypy.ini (mypy, strict).
      # Any error from either tool fails the build.
      # F401/E402 are intentionally ignored per CONTRIBUTING.md (unused
      # imports and module-level import order are accepted in this codebase).
      - name: Ruff (fail on error)
        run: ruff check . --ignore=F401,E402

      - name: Ruff format (fail if unformatted)
        run: ruff format --check .

      # Mypy strict — blocking. The codebase is fully typed (zero errors);
      # any new error fails the build.
      - name: Mypy (fail on error)
        run: mypy .

  # ---------------------------------------------------------------------------
  security:
    name: Dependency vulnerability scan (pip-audit)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: Install pip-audit
        run: pip install pip-audit

      # Fails the build on any known vulnerability in the pinned deps.
      # PYSEC-2026-1325 (ecdsa Minerva timing attack) is ignored: no fixed
      # release exists, ecdsa arrives transitively via python-jose, and the
      # app signs JWTs with HS256 so the vulnerable ECDSA path is never used.
      - name: Scan dependencies for known vulnerabilities
        run: pip-audit -r requirements.txt --ignore-vuln PYSEC-2026-1325

  # ---------------------------------------------------------------------------
  test:
    name: Test (ubuntu, Python ${{ matrix.python-version }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false                  # let all matrix legs finish
      matrix:
        python-version: ["3.11", "3.12"]

    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx

      # lotto.db is gitignored: build the schema from migrations, then seed
      # synthetic draws so backtest/ensemble/dashboard tests have data.
      - name: Initialize database (migrations + synthetic draws)
        run: |
          python migrate.py upgrade
          python - <<'EOF'
          import random, sqlite3
          rng = random.Random(42)
          conn = sqlite3.connect("lotto.db")
          for i in range(1, 61):
              nums = sorted(rng.sample(range(1, 41), 6))
              conn.execute(
                  "INSERT OR IGNORE INTO draws (draw_id, draw_date, numbers, bonus, powerball) "
                  "VALUES (?, ?, ?, ?, ?)",
                  (i, f"2024-{((i-1) % 12) + 1:02d}-{((i-1) % 27) + 1:02d}",
                   ",".join(map(str, nums)), rng.randint(1, 40), rng.randint(1, 10)),
              )
          conn.commit(); conn.close()
          print("Seeded 60 synthetic draws.")
          EOF

      # --cov=. (not --cov=src): this project keeps modules at the repo root,
      # there is no src/ package.
      - name: Run tests with coverage
        run: pytest tests test_lotto.py --cov=. --cov-report=xml --cov-report=term

      # Coverage upload is optional: skipped unless CODECOV_TOKEN is set.
      - name: Upload coverage to Codecov
        if: ${{ vars.CODECOV_ENABLED == 'true' }}
        uses: codecov/codecov-action@v4
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          file: coverage.xml
          fail_ci_if_error: false

  # ---------------------------------------------------------------------------
  test-windows:
    name: Test (windows-latest, Python 3.11)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pytest pytest-cov httpx

      # Same DB bootstrap as the Linux job, using bash for identical heredocs.
      - name: Initialize database (migrations + synthetic draws)
        shell: bash
        run: |
          python migrate.py upgrade
          python - <<'EOF'
          import random, sqlite3
          rng = random.Random(42)
          conn = sqlite3.connect("lotto.db")
          for i in range(1, 61):
              nums = sorted(rng.sample(range(1, 41), 6))
              conn.execute(
                  "INSERT OR IGNORE INTO draws (draw_id, draw_date, numbers, bonus, powerball) "
                  "VALUES (?, ?, ?, ?, ?)",
                  (i, f"2024-{((i-1) % 12) + 1:02d}-{((i-1) % 27) + 1:02d}",
                   ",".join(map(str, nums)), rng.randint(1, 40), rng.randint(1, 10)),
              )
          conn.commit(); conn.close()
          print("Seeded 60 synthetic draws.")
          EOF

      # Windows catches path separators and cp1252 encoding regressions.
      - name: Run tests
        run: pytest tests test_lotto.py --tb=short
