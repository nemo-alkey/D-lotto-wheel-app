# docker-compose.monitoring.yml — local observability stack.
#
# Prometheus scrapes the API's /metrics endpoint and evaluates
# monitoring/alerts.yml; Grafana visualises the metrics.
#
# Usage (from the project root, API running on :8000):
#   docker compose -f docker-compose.monitoring.yml up -d
#   Prometheus: http://localhost:9090
#   Grafana:    http://localhost:3000  (admin / admin — change via env)

services:
  prometheus:
    image: prom/prometheus:v2.54.1
    container_name: lotto-prometheus
    restart: unless-stopped
    ports:
      - "9090:9090"
    volumes:
      - ./monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ./monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus-data:/prometheus
    extra_hosts:
      # Reach the API on the Docker host (uvicorn api:app --port 8000).
      - "host.docker.internal:host-gateway"

  grafana:
    image: grafana/grafana:11.2.0
    container_name: lotto-grafana
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_ADMIN_USER:-admin}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ./monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - grafana-data:/var/lib/grafana
    depends_on:
      - prometheus

volumes:
  prometheus-data:
  grafana-data:
