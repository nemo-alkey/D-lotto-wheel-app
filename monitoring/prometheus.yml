# Prometheus scrape configuration for the Lotto Wheel API.
# Used by docker-compose.monitoring.yml.

global:
  scrape_interval: 30s
  evaluation_interval: 30s

rule_files:
  - /etc/prometheus/alerts.yml

scrape_configs:
  - job_name: lotto-api
    # The API runs on the host (uvicorn api:app --port 8000);
    # host.docker.internal reaches it from inside the container.
    static_configs:
      - targets:
          - host.docker.internal:8000
    metrics_path: /metrics
